<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#14243a"><meta name="description" content="Explore Lagos. Learn real skills. Level up."><title>Lagos Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head>
<body><div id="game-shell"><canvas id="world"></canvas>
<header class="topbar"><a class="brand"><span class="brand-mark">LL</span><span><b>LAGOS</b><small>LEARN</small></span></a><div class="player-stats"><div class="stat"><span class="stat-label">LEVEL</span><b id="level">01</b></div><div class="xp-wrap"><div class="xp-line"><span>XP</span><b id="xp-label">0 / 100</b></div><div class="xp-track"><i id="xp-bar"></i></div></div><div class="wallet">₦ <b id="cash">250</b></div><button class="icon-btn" id="menu-btn">☰</button></div></header>
<div class="location-pill"><span class="live-dot"></span>YABA DISTRICT <span class="location-divider">/</span> LAGOS, NIGERIA</div>
<aside class="mission-card"><div class="mission-kicker">YOUR NEXT MOVE</div><div class="mission-title">Find the Learning Centre</div><div class="mission-copy">Walk down the main road and look for the blue academy sign.</div><button id="mission-action" class="text-action">SHOW ME ↗</button></aside>
<div class="map-card"><div class="map-head">YABA MAP <span class="map-live">● LIVE</span></div><div class="mini-map"><div class="map-road road-a"></div><div class="map-road road-b"></div><div class="map-road road-c"></div><span class="map-pin pin-home">⌂</span><span class="map-pin pin-school">✦</span><span class="map-player" id="map-player"></span></div><div class="map-legend"><span><i class="legend-blue"></i>You</span><span><i class="legend-gold"></i>Learning Centre</span></div></div>
<div id="prompt" class="interaction-prompt hidden"><span class="keycap">E</span><span>Enter Learning Centre</span></div>
<div class="controls-hint"><b>W A S D</b> Move <span>•</span> <b>Mouse</b> Look <span>•</span> <b>E</b> Interact <span>•</span> <b>V</b> Ride</div>
<div class="mobile-controls"><div class="dpad"><button data-move="forward">▲</button><div><button data-move="left">◀</button><button data-move="back">▼</button><button data-move="right">▶</button></div></div><div class="mobile-actions"><button id="mobile-interact">E<br><small>ACT</small></button><button id="mobile-ride">RIDE<br><small>V</small></button></div></div>
<div class="bottom-left"><span class="avatar-dot">G</span><div><b>PLAYER ONE</b><small id="player-mode">ON FOOT</small></div></div><button class="sound-toggle" id="sound-toggle">♪ <span>Sound</span></button></div>
<div class="modal-backdrop hidden" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><button class="close-btn" id="close-modal">×</button><div id="modal-content"></div></section></div><div class="toast" id="toast"></div>
<script type="module" src="/src/main.js"></script></body></html>
